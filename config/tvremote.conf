# Sony RMT-V501F TV remote on the replacement PCB (shield tvremote + nice!view).

# Infrared and the TV / VIDEO / DVD slide switch.
CONFIG_MACROPAD_IR=y
CONFIG_TVREMOTE_MODE_SWITCH=y

# No RGB status LED on this board.
CONFIG_MACROPAD_STATUS_LED=n

# Hold POWER (row 0, col 5) while the batteries go in, or while plugging USB,
# for the flashing bootloader.
CONFIG_MACROPAD_BOOT_KEY=y
CONFIG_MACROPAD_BOOT_KEY_ROW=0
CONFIG_MACROPAD_BOOT_KEY_COL=5

# Deep sleep after 15 minutes untouched; any key wakes it (that press is lost,
# the remote restarts).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Only the selected Bluetooth host stays connected.
CONFIG_MACROPAD_BLE_EXCLUSIVE=y

# Remap keys in ZMK Studio (unlock with SET UP in the VIDEO position).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
