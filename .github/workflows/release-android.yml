name: Release Android app
# Builds the Android app (android-app/), separate from the desktop
# configurator. An android-v* tag builds a release APK signed with the key in
# the ANDROID_* secrets and opens a draft release with it; publish it from the
# Releases page. A manual run without those secrets builds a debug APK for testing.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Decide build type
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release tags need the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
            exit 1
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = release ]; then task=assembleRelease; else task=assembleDebug; fi
          ./gradlew "$task" --no-daemon
          cp "app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk" "$GITHUB_WORKSPACE/Macropad-Configurator.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Configurator-Android
          path: Macropad-Configurator.apk
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/Macropad-Configurator.apk"
          --draft --latest=false --title "Macropad Configurator for Android ${GITHUB_REF_NAME#android-v}"
          --notes-file RELEASE_NOTES.md
