name: Release configurator
# Builds the portable Windows app. A configurator-v* tag also opens a draft
# release with the .exe attached; publish it from the Releases page.
on:
  push:
    tags:
      - "configurator-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Configurator-Portable
          path: configurator/dist/Macropad-Configurator-Portable.exe
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" dist/Macropad-Configurator-Portable.exe
          --draft --title "Macropad Configurator $($env:GITHUB_REF_NAME -replace '^configurator-v','')"
          --notes-file RELEASE_NOTES.md
